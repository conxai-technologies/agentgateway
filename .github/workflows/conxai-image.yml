# conxai fork image: the standalone agentgateway data plane, built from the repo's own
# Dockerfile (the target upstream release.yml publishes), pushed to
# ghcr.io/conxai-technologies/agentgateway for linux/amd64 and linux/arm64. Each
# architecture builds natively on a GitHub-hosted runner of its own architecture, by
# digest; the merge job joins them into one multi-arch index, signs it keylessly with
# cosign and attaches a GitHub build-provenance attestation. Each per-arch image also
# carries BuildKit SBOM and provenance attestations.
#
# Tags: conxai/main -> conxai-main, sha-<short>; a dispatch from another branch -> its
# sanitised branch name, sha-<short>; a tag v*-conxai.* -> the tag itself, sha-<short>.
name: conxai-image

on:
  push:
    branches: [conxai/main]
    tags: ["v*-conxai.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conxai-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # `git describe --tags` needs history and tags.
          fetch-depth: 0
      - name: Version
        id: version
        # Same derivation as the Makefile's VERSION, without the leading v (release.yml
        # strips it too). The Dockerfile refuses to build an "unknown" version.
        run: |
          v="$(git describe --tags --always)"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${v#v}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=conxai-image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=conxai-image-${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          d="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${d#sha256:}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Merge, sign, attest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Merge the architectures into one index
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for d in *; do sources+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Resolve the index digest
        id: digest
        run: |
          ref="${IMAGE}:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$ref"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]] || { echo "no digest for $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}@${DIGEST}"
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Verify:"
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/conxai-image\\.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} -R ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
